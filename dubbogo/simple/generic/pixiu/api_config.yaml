name: pixiu
description: pixiu generic invocation sample
resources:
  - path: '/api/v1/generic/map'
    type: restful
    description: map mode
    methods:
      - httpVerb: POST
        enable: true
        timeout: 5000ms
        inboundRequest:
          requestType: http
        integrationRequest:
          requestType: triple
          url: tri://127.0.0.1:20001
          protocol: tri
          serialization: hessian2
          generic: "true"
          interface: com.dubbogo.pixiu.GenericGreeter
          method: SayHello
          mappingParams:
            - name: requestBody.types
              mapTo: opt.types
            - name: requestBody.values
              mapTo: opt.values
  - path: '/api/v1/generic/gson'
    type: restful
    description: gson mode
    methods:
      - httpVerb: POST
        enable: true
        timeout: 5000ms
        inboundRequest:
          requestType: http
        integrationRequest:
          requestType: triple
          url: tri://127.0.0.1:20001
          protocol: tri
          serialization: hessian2
          generic: gson
          interface: com.dubbogo.pixiu.GenericGreeter
          method: GetUser
          parameterTypes:
            - com.dubbogo.pixiu.User
          mappingParams:
            - name: requestBody.values
              mapTo: opt.values
